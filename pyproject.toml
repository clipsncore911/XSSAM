[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xssam"
version = "0.1.0"
description = "XSS Reconnaissance & Validation Automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.27,<1",
    "playwright>=1.44,<2",
    "pydantic>=2,<3",
    "rich>=13,<15",
    "jinja2>=3.1,<4",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "Flask>=3,<4",
]

[project.scripts]
xssam = "xssam.cli:main"

[tool.setuptools]
include-package-data = true

# Explicit discovery prevents setuptools from treating the top-level config/
# directory as a second Python package on Linux. Namespace discovery includes
# the package-data directories themselves without noisy build warnings.
[tool.setuptools.packages.find]
where = ["."]
include = ["xssam*"]
namespaces = true

[tool.setuptools.package-data]
"xssam.defaults" = ["*.yaml"]
"xssam.payloads.groups" = ["*.yaml"]
"xssam.reporting.templates" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Deliberately broad catches keep one bad page, payload file, or browser
# context from terminating an otherwise valid authorized scan.
ignore = ["BLE001", "S110", "PYI034"]
