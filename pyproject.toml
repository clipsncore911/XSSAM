[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xssam"
version = "0.1.0"
description = "XSS Reconnaissance & Validation Automation"
dependencies = [
    "httpx",
    "playwright",
    "pydantic",
    "rich",
    "jinja2",
    "beautifulsoup4",
    "pyyaml",
]
requires-python = ">=3.11"

[project.scripts]
xssam = "xssam.cli:main"
