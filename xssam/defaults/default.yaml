# Packaged defaults. Used when running an installed XSSAM outside the repo.
scope:
  allowed_domains: []
  subdomain_scope: false
  scope_file: null

crawler:
  max_depth: 2
  max_urls: 100
  max_requests: 500

scanner:
  reflected: true
  stored: false
  dom: false
  comprehensive_payloads: true
  max_payloads_per_parameter: 12

performance:
  threads: 5
  delay: 0.1
  timeout: 10

browser:
  enabled: false
  headless: true
  navigation_timeout: 15
  settle_time: 0.5

reporting:
  html: true
  json: true
  txt: true
